services:
  mongodb:
    image: mongo:7.0
    container_name: vivavox-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: vivavox
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - vivavox-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  vivavox-network:
    driver: bridge
